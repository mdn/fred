name: Bundle Size

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Queue runs instead of replacing the pending one, so each `main` commit gets a baseline.
  queue: max

jobs:
  bundle-size:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version-file: ".nvmrc"

      - name: Install
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build with Rsdoctor
        run: npm run build
        env:
          RSDOCTOR: true

      - name: Analyze bundle size
        uses: web-infra-dev/rsdoctor-action@d5bda00d0d6e966f75130e0634502ce63dc7b9d8 # v1.2.1
        with:
          file_path: out/static/client/rsdoctor-data.json
          target_branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.repository.default_branch }}
          enable_ai_analysis: false
