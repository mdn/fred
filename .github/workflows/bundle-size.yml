name: Bundle Size

on:
  workflow_call:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  bundle-size:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version-file: ".nvmrc"

      - name: Install
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build with Rsdoctor
        run: npm run build
        env:
          RSDOCTOR: true

      - name: Analyze bundle size
        uses: web-infra-dev/rsdoctor-action@f4e6e8ec8b71c748cf6dd546467e22e12341164e # main
        with:
          file_path: out/static/client/rsdoctor-data.json
          target_branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.repository.default_branch }}
