name: Bundle Size

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Queue runs, so each `main` commit gets a baseline.
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version-file: ".nvmrc"

      - name: Install
        run: npm ci
        env:
          # Read-only here (`contents: read`), only raises the API rate limit.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build with Rsdoctor
        run: npm run build
        env:
          RSDOCTOR: true

      - name: Upload Rsdoctor data + assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rsdoctor-data
          # The analyzer reads built assets to fill missing gzip sizes.
          path: out/static/client
          if-no-files-found: error
          retention-days: 7

  # Never runs PR code: the write token must not be exposed to dependencies or build scripts.
  analyze:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      # The action reads the commit hash from the checkout.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Rsdoctor data + assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rsdoctor-data
          path: out/static/client

      - name: Analyze bundle size
        uses: web-infra-dev/rsdoctor-action@d5bda00d0d6e966f75130e0634502ce63dc7b9d8 # v1.2.1
        with:
          file_path: out/static/client/rsdoctor-data.json
          target_branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.repository.default_branch }}
          enable_ai_analysis: false
